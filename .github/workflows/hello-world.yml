name: Hello World Workflows

on:
  push:
    branches: [main]
    paths:
      - 'projects/ci-cd-actions/**'  #  Only runs when this folder changes  
  pull_request:
    branches:
      - main
    paths:
      - 'projects/ci-cd-actions/**'  #  Only runs when PR affects this folder  

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hello World
        run: echo "hello World"
        shell: bash

  goodbye:
    runs-on: ubuntu-latest
    steps:
      - name: goodbye
        run: echo "goodbye World"
        shell: bash      