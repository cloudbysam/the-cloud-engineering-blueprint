name: CI/CD Learning Playground

on:
  # TRIGGER 1: Code Pushes
  push:
    branches: [main]
    paths:
      - "projects/ci-cd-actions/**"

  # TRIGGER 2: GitHub Issues
  issues:
    types: [opened]

  workflow_dispatch:

jobs:
  # This job ONLY runs during a code push
  python-test-job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

        # We use 'working-directory' so GitHub knows to look inside your subfolder
      - name: Execute Python Script
        working-directory: ./projects/ci-cd-actions
        run: python app.py

    # --- Automated Staging Deployment ---
  terraform-staging:
    runs-on: ubuntu-latest
    needs: python-test-job  # Waits for your tests to pass first
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1  

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Apply (Staging)
        working-directory: ./projects/ci-cd-actions/terraform
        run: |
          echo "Initializing Terraform for Staging..."
          
          # We pass a specific backend config file for staging
          terraform init -backend-config="key=staging/terraform.tfstate"

          echo "Generating Staging Plan..."
          terraform plan -var="env=staging" # <--- Safely logs out what it will create
          
          terraform apply -auto-approve -var="env=staging"
          echo "Staging infrastructure deployed successfully!"

  # --- Protected Production Deployment ---
  terraform-production:
    runs-on: ubuntu-latest
    needs: terraform-staging  # Forces staging to finish successfully first
    
    # This key tells GitHub to pause and check the environment protection rules
    environment: production   
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Apply (Production)
        working-directory: ./projects/ci-cd-actions/terraform
        run: |
          echo "Initializing Terraform for Production..."
          
          # We pass a specific backend config file for production
          terraform init -backend-config="key=production/terraform.tfstate"

          echo "Generating Production Plan..."
          terraform plan -var="env=production" # <--- You can inspect this output while the pipeline is paused!
          
          terraform apply -auto-approve -var="env=production"
          echo "Production infrastructure deployed safely!"     

        # This Job is used for building the docker image.
  build-docker-job:
    runs-on: ubuntu-latest
    needs: python-test-job
    permissions:
      packages: write
    steps:
      - name: Set up gated env
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Environment
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        working-directory: ./projects/ci-cd-actions
        run: docker build -t ghcr.io/${{ github.repository }}:latest .

      - name: Push Docker Image
        run: docker push ghcr.io/${{ github.repository }}:latest

  # This job ONLY runs when a GitHub Issue is opened
  issue-automation-job:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      issues: write # Gives the runner permission to type a comment back to you
    steps:
      - name: Dump Issue Context Data
        run: echo '${{ toJson(github.event.issue) }}' | jq

      - name: Auto-Comment on the Issue
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            Hello @${{ github.event.issue.user.login }}! 
            Thanks for opening this issue. Our automated GitHub Action bot processed this instantly!
