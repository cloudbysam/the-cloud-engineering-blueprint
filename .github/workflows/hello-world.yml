name: CI/CD Learning Playground

on:
  # TRIGGER 1: Code Pushes
  push:
    branches: [main]
    paths:
      - "projects/ci-cd-actions/**"

  # TRIGGER 2: GitHub Issues
  issues:
    types: [opened]

  workflow_dispatch:

jobs:
  # This job ONLY runs during a code push
  python-test-job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # We use 'working-directory' so GitHub knows to look inside your subfolder
      - name: Execute Python Script
        working-directory: ./projects/ci-cd-actions
        run: python app.py

  # --- Automated Staging Deployment ---
  terraform-staging:
    runs-on: ubuntu-latest
    needs:
      python-test-job # Waits for your tests to pass first

    # GRANT PERMISSION TO REQUEST OIDC TOKEN
    permissions:
      id-token: write # This is REQUIRED to request the JWT from GitHub
      contents: read # Required for actions/checkout

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # TELL IT TO ASSUME A ROLE, NOT USE STATIC KEYS
          role-to-assume: ${{ vars.AWS_STAGING_ROLE_ARN }}
          role-session-name: GitHubActionsStagingSession
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Apply (Staging)
        working-directory: ./projects/ci-cd-actions/terraform
        run: |
          echo "Initializing Terraform for Staging..."

          # We pass a specific backend config file for staging
          terraform init -backend-config="key=staging/terraform.tfstate"

          echo "Generating Staging Plan..."
          terraform plan -var="env=staging" # <--- Safely logs out what it will create

          terraform apply -auto-approve -var="env=staging"
          echo "Staging infrastructure deployed successfully!"

  # --- Step 1: Generate Production Plan (No Approval Gate) ---
  plan-production:
    runs-on: ubuntu-latest
    needs: terraform-staging # Forces staging to finish successfully first

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PRODUCTION_ROLE_ARN }}
          role-session-name: GitHubActionsProductionPlanSession
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Plan (Production)
        working-directory: ./projects/ci-cd-actions/terraform
        run: |
          echo "Initializing Terraform for Production..."
          terraform init -backend-config="key=production/terraform.tfstate"

          echo "Generating Production Plan..."
          # Save the exact execution plan to a file so apply-production uses this exact snapshot
          terraform plan -var="env=production" -out=prod.tfplan

      # WARNING: Plan files contain full resource attributes. Only upload when the plan
      # contains no sensitive secrets, and keep retention-days at 1.
      - name: Upload Production Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-tfplan
          path: ./projects/ci-cd-actions/terraform/prod.tfplan
          retention-days: 1

  # --- Step 2: Protected Production Apply (Waits for Human Approval) ---
  apply-production:
    runs-on: ubuntu-latest
    needs: plan-production # Waits for the plan artifact to be generated first

    permissions:
      id-token: write
      contents: read

    # Pauses here so reviewers can inspect the plan-production logs BEFORE approving
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PRODUCTION_ROLE_ARN }}
          role-session-name: GitHubActionsProductionApplySession
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Download Production Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: prod-tfplan
          path: ./projects/ci-cd-actions/terraform

      - name: Terraform Init & Apply Saved Plan (Production)
        working-directory: ./projects/ci-cd-actions/terraform
        run: |
          echo "Initializing Terraform for Production..."
          terraform init -backend-config="key=production/terraform.tfstate"

          echo "Applying Reviewed Production Plan..."
          # Passing prod.tfplan applies ONLY what was reviewed (no -auto-approve needed)
          terraform apply prod.tfplan
          echo "Production infrastructure deployed safely!"

  # This Job is used for building the docker image.
  build-docker-job:
    runs-on: ubuntu-latest
    needs: python-test-job
    permissions:
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Environment
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        working-directory: ./projects/ci-cd-actions
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}:latest \
            -t ghcr.io/${{ github.repository }}:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

  # This job ONLY runs when a GitHub Issue is opened
  issue-automation-job:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      issues: write # Gives the runner permission to type a comment back to you
    steps:
      - name: Dump Issue Context Data
        env:
          ISSUE_JSON: ${{ toJson(github.event.issue) }}
        run: echo "$ISSUE_JSON" | jq

      - name: Auto-Comment on the Issue
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            Hello @${{ github.event.issue.user.login }}! 
            Thanks for opening this issue. Our automated GitHub Action bot processed this instantly!
