name: Hello World Workflows

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hello World
        run: echo "hello World"
        shell: bash

  goodbye:
    runs-on: ubuntu-latest
    steps:
      - name: goodbye
        run: echo "goodbye World"
        shell: bash      